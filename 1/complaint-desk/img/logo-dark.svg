        fill="#ffffff">Complaint<tspan fill="#f87171">Desk</tspan></text>

  <!-- Subtitle -->
  <text x="120" y="84"
        font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif"
        font-size="13.5"
