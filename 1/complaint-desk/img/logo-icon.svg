<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ea4335;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c5221a;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background square - no filter -->
  <rect x="0" y="0" width="100" height="100" rx="20" ry="20" fill="url(#iconGrad)"/>

  <!-- Document body -->
  <rect x="20" y="14" width="48" height="62" rx="5" ry="5" fill="white" opacity="0.95"/>

  <!-- Fold corner -->
  <polygon points="52,14 68,14 68,30 52,30" fill="#ea4335" opacity="0.3"/>
  <polygon points="52,14 68,30 52,30" fill="white" opacity="0.55"/>

  <!-- Document text lines -->
  <rect x="27" y="38" width="30" height="4" rx="2" fill="#ea4335" opacity="0.3"/>
  <rect x="27" y="47" width="24" height="4" rx="2" fill="#ea4335" opacity="0.3"/>
  <rect x="27" y="56" width="27" height="4" rx="2" fill="#ea4335" opacity="0.3"/>

  <!-- Checkmark circle -->
  <circle cx="70" cy="82" r="16" fill="#34a853"/>
  <polyline points="61,82 67.5,88.5 80,73" fill="none" stroke="white" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
