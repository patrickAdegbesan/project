<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}Lush Hair NG — Resume Screener{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"/>
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.7/css/dataTables.bootstrap5.min.css"/>
  <link rel="stylesheet" href="/static/css/main.css"/>
</head>
<body>

<!-- Sidebar -->
<div class="sidebar" id="sidebar">
  <div class="sidebar-brand">
    <div class="brand-icon"><i class="bi bi-scissors"></i></div>
    <div>
      <div class="brand-name">Lush Hair NG</div>
      <div class="brand-sub">Resume Screener</div>
    </div>
  </div>

  <nav class="sidebar-nav">
    <a href="/" class="nav-item {% block nav_home %}{% endblock %}">
      <i class="bi bi-speedometer2"></i> Dashboard
    </a>
    <a href="/upload" class="nav-item {% block nav_upload %}{% endblock %}">
      <i class="bi bi-cloud-upload"></i> Upload Resumes
    </a>
    <a href="/jobs" class="nav-item {% block nav_jobs %}{% endblock %}">
      <i class="bi bi-briefcase"></i> Job Roles
    </a>
  </nav>

  <div class="sidebar-footer">
    <div class="hub-badge">
      <i class="bi bi-geo-alt-fill text-success"></i>
      <span>Hub: Ikeja, Lagos</span>
    </div>
  </div>
</div>

<!-- Main content wrapper -->
<div class="main-wrapper">
  <!-- Top bar -->
  <header class="topbar">
    <button class="btn btn-sm btn-outline-secondary d-lg-none" id="sidebarToggle">
      <i class="bi bi-list"></i>
    </button>
    <div class="topbar-title">{% block page_title %}Dashboard{% endblock %}</div>
    <div class="topbar-actions">
      <span class="badge bg-success-subtle text-success border border-success-subtle px-3 py-2">
        <i class="bi bi-circle-fill me-1" style="font-size:0.5rem"></i>System Online
      </span>
    </div>
  </header>

  <!-- Page content -->
  <main class="page-content">
    {% block content %}{% endblock %}
  </main>
</div>

<!-- Toast container -->
<div class="toast-container position-fixed bottom-0 end-0 p-3" id="toastContainer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<script src="https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.7/js/dataTables.bootstrap5.min.js"></script>
<script src="/static/js/main.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
