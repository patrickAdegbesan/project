; Sentry configuration. Copy this file to config.ini and edit it.
; config.ini is git-ignored so your credentials never get committed.

[capture]
; Where to write evidence before/instead of sending it.
; Point this at a folder your cloud drive syncs (Google Drive / iCloud /
; Dropbox) and the photos show up on your phone automatically.
output_dir = ./evidence

; Take a webcam photo? (true/false). Set false on a machine with no camera.
webcam = true

; Which camera index to use (0 is the default/built-in camera).
camera_index = 0

; Also grab a screenshot of the desktop? (true/false)
screenshot = true

; Give the camera this many warm-up frames before keeping one (helps on
; cameras that return a dark first frame).
warmup_frames = 5

[email]
; Set enabled = true to also email the evidence to yourself.
enabled = false

; For Gmail: turn on 2-Step Verification, then create an *App Password*
; (Google Account -> Security -> App passwords) and paste it below.
; Do NOT use your normal account password.
smtp_host = smtp.gmail.com
smtp_port = 587
username = you@gmail.com
app_password = your-16-char-app-password
from_addr = you@gmail.com
to_addr = you@gmail.com

[log]
; Timestamped one-line record of every capture.
file = ./evidence/sentry.log
